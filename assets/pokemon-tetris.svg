<svg xmlns="http://www.w3.org/2000/svg" width="760" height="210" viewBox="0 0 760 210" role="img" aria-labelledby="title desc"><title id="title">Pokémon Tetris · Auto-play</title><desc id="desc">A looping pixel-art puzzle animation with falling blocks and a Poké Ball-inspired tile.</desc><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#34445a" stroke-width="1"/></pattern><clipPath id="board"><rect x="32" y="25" width="220" height="160" rx="5"/></clipPath></defs><rect width="760" height="210" rx="18" fill="#101b2d"/><rect x="18" y="12" width="250" height="186" rx="11" fill="#344d4c"/><rect x="25" y="19" width="236" height="172" rx="7" fill="#c8dfa5"/><rect x="32" y="25" width="220" height="160" rx="5" fill="#142538"/><rect x="32" y="25" width="220" height="160" rx="5" fill="url(#grid)"/><g clip-path="url(#board)"><g transform="translate(0 -48)"><animateTransform attributeName="transform" type="translate" from="0 -48" to="0 110" dur="2.8s" repeatCount="indefinite"/><rect x="72" y="31" width="19" height="19" rx="2" fill="#df4a58"/><rect x="92" y="31" width="19" height="19" rx="2" fill="#df4a58"/><rect x="92" y="51" width="19" height="19" rx="2" fill="#df4a58"/><rect x="112" y="51" width="19" height="19" rx="2" fill="#df4a58"/></g><g transform="translate(0 -85)"><animateTransform attributeName="transform" type="translate" from="0 -85" to="0 120" dur="3.6s" begin=".7s" repeatCount="indefinite"/><rect x="152" y="31" width="19" height="19" rx="2" fill="#f1c94a"/><rect x="172" y="31" width="19" height="19" rx="2" fill="#f1c94a"/><rect x="152" y="51" width="19" height="19" rx="2" fill="#f1c94a"/><rect x="172" y="51" width="19" height="19" rx="2" fill="#f1c94a"/></g><g transform="translate(0 -30)"><animateTransform attributeName="transform" type="translate" from="0 -30" to="0 118" dur="2.4s" begin="1.3s" repeatCount="indefinite"/><rect x="112" y="31" width="19" height="19" rx="2" fill="#58c4dd"/><rect x="112" y="51" width="19" height="19" rx="2" fill="#58c4dd"/><rect x="112" y="71" width="19" height="19" rx="2" fill="#58c4dd"/><rect x="132" y="71" width="19" height="19" rx="2" fill="#58c4dd"/></g><rect x="32" y="145" width="220" height="4" fill="#f1c94a" opacity="0"><animate attributeName="opacity" values="0;.85;0" dur="1s" begin="1.8s" repeatCount="indefinite"/></rect><rect x="32" y="165" width="220" height="4" fill="#58c4dd" opacity="0"><animate attributeName="opacity" values="0;.8;0" dur="1.2s" begin="2.5s" repeatCount="indefinite"/></rect></g><text x="302" y="67" font-family="monospace" font-size="13" letter-spacing="4" fill="#58c4dd">POKÉMON · BONUS STAGE</text><text x="302" y="108" font-family="monospace" font-size="27" font-weight="700" letter-spacing="2" fill="#f1c94a">TETRIS AUTO-PLAY</text><text x="302" y="137" font-family="monospace" font-size="14" letter-spacing="1" fill="#e8f2ff">FALLING PIXEL PUZZLES · LOOPING ANIMATION</text><g transform="translate(676 82)"><circle r="27" fill="#e8f2ff"/><path d="M-25-10a27 27 0 0 1 50 0H-25Z" fill="#df4a58"/><path d="M-27 0H27" stroke="#142538" stroke-width="6"/><circle r="7" fill="#e8f2ff" stroke="#142538" stroke-width="4"/><circle r="2.5" fill="#58c4dd"/></g><text x="302" y="176" font-family="monospace" font-size="11" letter-spacing="2" fill="#9aa9bf">AN ORIGINAL PIXEL-ART MINI-GAME SCENE</text></svg>
