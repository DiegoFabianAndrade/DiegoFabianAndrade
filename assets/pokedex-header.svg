<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc"><title id="title">Diego Andrade Pokédex trainer profile</title><desc id="desc">A retro game-style Pokédex with animated scan light, trainer name, region, and developer focus.</desc><defs><pattern id="g" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0V12" fill="none" stroke="#9ecb8a" stroke-opacity=".12"/></pattern><linearGradient id="shell" x2="0" y2="1"><stop stop-color="#f1f0da"/><stop offset="1" stop-color="#b9c5ad"/></linearGradient></defs><rect width="1100" height="300" rx="18" fill="#101b2d"/><rect width="1100" height="300" rx="18" fill="url(#g)"/><g transform="translate(35 19)"><rect width="265" height="262" rx="26" fill="url(#shell)" stroke="#7f948b" stroke-width="5"/><path d="M2 25Q2 2 25 2H240Q263 2 263 25V53H2Z" fill="#cc3948"/><circle cx="31" cy="28" r="12" fill="#84d8ed" stroke="#f8f0d6" stroke-width="4"/><circle cx="71" cy="28" r="6" fill="#e9d269"/><circle cx="91" cy="28" r="6" fill="#76ba78"/><rect x="27" y="75" width="211" height="132" rx="7" fill="#233a40" stroke="#354a4c" stroke-width="6"/><rect x="36" y="84" width="193" height="114" rx="4" fill="#cce3ae"/><text x="50" y="110" fill="#305040" font-family="monospace" font-size="12" letter-spacing="2">TRAINER DEX · NO. 001</text><text x="50" y="146" fill="#172e36" font-family="monospace" font-size="25" font-weight="bold">DIEGO ANDRADE</text><text x="50" y="171" fill="#38564c" font-family="monospace" font-size="12">COLOMBIA · SOFTWARE / AI</text><rect x="42" y="88" width="180" height="3" fill="#fff" opacity=".8"><animate attributeName="y" values="88;191;88" dur="4s" repeatCount="indefinite"/></rect><circle cx="131" cy="235" r="12" fill="#c63846"/><circle cx="131" cy="235" r="4" fill="#f4f0df"/></g><g transform="translate(355 64)"><text y="0" fill="#9fd8e5" font-family="monospace" font-size="16" letter-spacing="4">WELCOME, TRAINER_001</text><text y="68" fill="#f6f1df" font-family="Arial,sans-serif" font-size="44" font-weight="800">BUILD · LEARN · EVOLVE</text><text y="111" fill="#f1cf59" font-family="monospace" font-size="19" letter-spacing="2">FULL-STACK DEVELOPMENT  /  AI &amp; ML</text><path d="M0 137H680" stroke="#cc3948" stroke-width="4"/><text y="174" fill="#c5d7d8" font-family="monospace" font-size="16">NEW PROJECT DETECTED ON ROUTE 01</text><rect y="197" width="220" height="31" rx="4" fill="#1e3540"/><text x="13" y="218" fill="#a8d891" font-family="monospace" font-size="13">STATUS: <animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/> TRAINING</text><text x="0" y="263" fill="#7899a6" font-family="monospace" font-size="12" letter-spacing="2">KANTO INSPIRED · MADE BY DIEGO</text></g><rect x="1" y="1" width="1098" height="298" rx="18" fill="none" stroke="#bed5dc" stroke-opacity=".5" stroke-width="2"/></svg>
