<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Diego Andrade — Vice City developer HUD</title>
<desc id="desc">Original animated open-world video game HUD with neon skyline, a radial weapon-wheel-inspired technology loadout, wanted stars and mini-map radar. Unofficial fan-inspired design with no Rockstar or GTA logos.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#080b1b"/><stop offset=".53" stop-color="#28123e"/><stop offset="1" stop-color="#a32c77"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff3eb5"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#24e5ff"/></linearGradient>
 <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe8a3"/><stop offset="1" stop-color="#ff4eaa"/></linearGradient>
 <radialGradient id="wheel"><stop stop-color="#1b2943" stop-opacity=".98"/><stop offset="1" stop-color="#070a14" stop-opacity=".97"/></radialGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="scan" width="4" height="5" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".035"/></pattern>
 <clipPath id="clip"><rect width="1200" height="460" rx="18"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="1200" height="460" fill="url(#sky)"/>
<g fill="#fff" opacity=".65"><circle cx="52" cy="36" r="1.5"/><circle cx="170" cy="68" r="1"/><circle cx="315" cy="34" r="1.4"/><circle cx="422" cy="80" r="1"/><circle cx="566" cy="38" r="1.5"/><circle cx="690" cy="68" r="1"/><circle cx="1030" cy="36" r="1.5"/><circle cx="1138" cy="78" r="1"/></g>
<circle cx="225" cy="150" r="76" fill="url(#sun)" opacity=".9" filter="url(#glow)"/>
<g fill="#45204f" opacity=".9"><rect x="152" y="145" width="146" height="6"/><rect x="152" y="158" width="146" height="7"/><rect x="152" y="173" width="146" height="8"/><rect x="152" y="191" width="146" height="9"/></g>
<g fill="#0c1024"><path d="M0 305V230H40V257H67V204H104V271H131V242H160V289H185V224H226V279H256V248H289V287H320V213H361V278H393V240H427V290H458V255H494V284H520V225H560V292H595V248H627V286H657V230H697V300H0Z"/><path d="M0 332V290H29V306H56V272H83V317H114V298H140V323H174V281H201V327H235V304H267V329H302V292H329V330H364V309H398V328H433V286H462V335H499V304H531V327H564V292H594V336H630V310H663V332H699V295H730V339H0Z"/></g>
<path d="M0 345L1200 325V460H0Z" fill="#070a14"/><path d="M0 359L1200 340" stroke="#21e6ff" stroke-width="2" opacity=".75" filter="url(#glow)"/><path d="M0 404L1200 385" stroke="#ff3eb5" stroke-width="2" opacity=".7" filter="url(#glow)"/>
<!-- Character / mission panel -->
<g transform="translate(48 88)">
 <text fill="#22e5ff" font-family="monospace" font-size="13" letter-spacing="4">VICE CITY // DEVELOPER HUD</text>
 <text y="65" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="46" letter-spacing="1">DIEGO ANDRADE</text>
 <text y="99" fill="#fff" font-family="monospace" font-size="15" letter-spacing="2">FULL-STACK  ×  AI / ML</text>
 <path d="M0 120H390" stroke="url(#neon)" stroke-width="4" filter="url(#glow)"/>
 <text y="148" fill="#ffe2f5" font-family="monospace" font-size="12" letter-spacing="1">MISSION: BUILD BETTER SOFTWARE</text>
 <g transform="translate(0 172)" font-family="monospace" font-size="10" letter-spacing=".5">
  <rect x="0" y="0" width="123" height="24" rx="4" fill="#080b16" stroke="#ff3eb5"/><text x="9" y="15" fill="#fff">JAVA / SPRING</text>
  <rect x="132" y="0" width="110" height="24" rx="4" fill="#080b16" stroke="#24e5ff"/><text x="143" y="15" fill="#fff">PYTHON / AI</text>
  <rect x="251" y="0" width="126" height="24" rx="4" fill="#080b16" stroke="#a855f7"/><text x="261" y="15" fill="#fff">REACT / VITE</text>
 </g>
</g>
<!-- Wanted stars / classic game HUD nod -->
<g transform="translate(48 34)" font-family="monospace">
 <text x="0" y="0" fill="#dbeafe" font-size="10" letter-spacing="2">WANTED LEVEL</text>
 <g transform="translate(117 -10)" fill="#ffdf70" filter="url(#glow)">
  <path d="M0 0l4 9 10 1-7 6 2 10-9-5-9 5 2-10-7-6 10-1Z"><animate attributeName="opacity" values=".45;1;.45" dur="2.8s" repeatCount="indefinite"/></path>
  <path d="M27 0l4 9 10 1-7 6 2 10-9-5-9 5 2-10-7-6 10-1Z" opacity=".65"/>
  <path d="M54 0l4 9 10 1-7 6 2 10-9-5-9 5 2-10-7-6 10-1Z" opacity=".3"/>
 </g>
</g>
<!-- Original radial weapon-wheel-inspired technology loadout -->
<g transform="translate(885 224)">
 <circle r="166" fill="#070a14" fill-opacity=".56" stroke="#24e5ff" stroke-opacity=".65" stroke-width="1.5"/>
 <circle r="153" fill="none" stroke="#ff3eb5" stroke-opacity=".75" stroke-width="1.5" stroke-dasharray="4 7"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="42s" repeatCount="indefinite"/></circle>
 <circle r="136" fill="url(#wheel)" stroke="#a855f7" stroke-width="2"/>
 <g fill="none" stroke="#58657e" stroke-width="1.5"><path d="M0 0L0 -135"/><path d="M0 0L95 -95"/><path d="M0 0L135 0"/><path d="M0 0L95 95"/><path d="M0 0L0 135"/><path d="M0 0L-95 95"/><path d="M0 0L-135 0"/><path d="M0 0L-95 -95"/></g>
 <path d="M-96 -96 A136 136 0 0 1 0 -136 L0 -48 A48 48 0 0 0 -34 -34Z" fill="#ff3eb5" fill-opacity=".25" stroke="#ff3eb5" stroke-width="2" filter="url(#glow)"/>
 <path d="M-96 -96 A136 136 0 0 1 0 -136" fill="none" stroke="#ff3eb5" stroke-width="4"><animate attributeName="opacity" values=".35;1;.35" dur="2.2s" repeatCount="indefinite"/></path>
 <!-- AI -->
 <g transform="translate(-61 -78)" stroke="#24e5ff" stroke-width="2" fill="none"><path d="M-10 -6L0 -14L12 -4L2 8L-10 -6M0 -14L2 8M-10 -6L12 -4"/><g fill="#24e5ff"><circle cx="-10" cy="-6" r="3"/><circle cx="0" cy="-14" r="3"/><circle cx="12" cy="-4" r="3"/><circle cx="2" cy="8" r="3"/></g></g><text x="-43" y="-27" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">AI / ML</text>
 <!-- Python -->
 <g transform="translate(61 -78)" stroke="#ffd166" stroke-width="3" fill="none"><path d="M-12 -5v-8q0-8 8-8h10q8 0 8 8v7h-13q-7 0-7 7v7"/><path d="M12 5v8q0 8-8 8h-10q-8 0-8-8v-7h13q7 0 7-7v-7"/><circle cx="-3" cy="-14" r="1.5" fill="#ffd166"/><circle cx="3" cy="14" r="1.5" fill="#ffd166"/></g><text x="62" y="-27" fill="#fff" font-family="monospace" font-size="10" text-anchor="middle">PYTHON</text>
 <!-- Web -->
 <g transform="translate(108 4)" stroke="#24e5ff" stroke-width="2" fill="none"><rect x="-15" y="-12" width="30" height="22" rx="3"/><path d="M-15 -5H15M-8 0L-3 4L-8 8M0 8H7"/></g><text x="101" y="31" fill="#fff" font-family="monospace" font-size="10" text-anchor="middle">WEB</text>
 <!-- SQL -->
 <g transform="translate(61 78)" stroke="#a78bfa" stroke-width="2" fill="none"><ellipse cx="0" cy="-10" rx="13" ry="5"/><path d="M-13 -10v19q0 6 13 6t13-6v-19M-13 0q0 6 13 6t13-6"/></g><text x="61" y="107" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">SQL</text>
 <!-- Java -->
 <g transform="translate(0 107)" stroke="#ff6b6b" stroke-width="2" fill="none"><path d="M-10 -8q15 -8 0 -15M0 -8q15 -8 0 -15M-13 0q13 7 26 0M-11 6q11 5 22 0M-8 12q8 3 16 0"/></g><text x="0" y="86" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">JAVA 21</text>
 <!-- Git -->
 <g transform="translate(-66 78)" stroke="#ffb347" stroke-width="3" fill="none"><path d="M-10 -12L10 8M-10 -12V12M-10 0H8"/><circle cx="-10" cy="-12" r="3" fill="#ffb347"/><circle cx="-10" cy="12" r="3" fill="#ffb347"/><circle cx="8" cy="0" r="3" fill="#ffb347"/></g><text x="-65" y="107" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">GIT</text>
 <!-- API -->
 <g transform="translate(-108 4)" stroke="#24e5ff" stroke-width="2" fill="none"><path d="M-12 -9h8l4 6 4-6h8M-12 9h8l4-6 4 6h8M-12 -9v18M12 -9v18"/></g><text x="-105" y="31" fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">API</text>
 <!-- security -->
 <g transform="translate(-66 -78)" stroke="#ff3eb5" stroke-width="2" fill="none"><path d="M0 -15L13 -10V0q0 10-13 16Q-13 10-13 0V-10Z"/><path d="M-5 0l4 4 7-8"/></g><text x="-105" y="-27" fill="#fff" font-family="monospace" font-size="10" text-anchor="middle">SEC</text>
 <circle r="40" fill="#070a14" stroke="#24e5ff" stroke-width="2" filter="url(#glow)"/><circle r="32" fill="none" stroke="#ff3eb5" stroke-width="1" stroke-dasharray="3 4"/>
 <text y="-3" fill="#fff" font-family="monospace" font-size="10" text-anchor="middle">SELECT</text><text y="12" fill="#24e5ff" font-family="monospace" font-size="10" text-anchor="middle">LOADOUT</text>
 <circle r="173" fill="none" stroke="#24e5ff" stroke-opacity=".3"><animate attributeName="r" values="167;175;167" dur="4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".15;.6;.15" dur="4s" repeatCount="indefinite"/></circle>
</g>
<!-- mini-map radar -->
<g transform="translate(1082 362)">
 <rect x="-62" y="-61" width="116" height="102" rx="7" fill="#08131d" fill-opacity=".9" stroke="#24e5ff" stroke-width="1.5"/>
 <circle cx="-4" cy="-11" r="34" fill="#102a32" stroke="#5be7c4" stroke-width="1.5"/>
 <circle cx="-4" cy="-11" r="23" fill="none" stroke="#5be7c4" stroke-opacity=".65"/><circle cx="-4" cy="-11" r="11" fill="none" stroke="#5be7c4" stroke-opacity=".65"/>
 <path d="M-38 -11H30M-4 -45V23M-30 -36L22 14M22 -36L-30 14" stroke="#5be7c4" stroke-opacity=".45" stroke-width="1"/>
 <path d="M-4 -11L7 -25L4 -7Z" fill="#ff3eb5" filter="url(#glow)"/><circle cx="-4" cy="-11" r="3" fill="#fff"/>
 <text x="-51" y="33" fill="#d1fae5" font-family="monospace" font-size="8">MISSION RADAR</text>
</g>
<g transform="translate(48 420)" font-family="monospace" font-size="10" letter-spacing="1"><text fill="#24e5ff">HEALTH</text><rect x="56" y="-9" width="98" height="7" rx="2" fill="#172536" stroke="#24e5ff" stroke-width=".7"/><rect x="57" y="-8" width="78" height="5" rx="1" fill="#24e5ff"><animate attributeName="width" values="65;78;65" dur="5s" repeatCount="indefinite"/></rect><text x="174" fill="#ff3eb5">ARMOR</text><rect x="224" y="-9" width="98" height="7" rx="2" fill="#172536" stroke="#ff3eb5" stroke-width=".7"/><rect x="225" y="-8" width="65" height="5" rx="1" fill="#ff3eb5"/></g>
<rect width="1200" height="460" fill="url(#scan)" pointer-events="none"/>
<rect x="1" y="1" width="1198" height="458" rx="18" fill="none" stroke="url(#neon)" stroke-width="2"/>
<path d="M0 448H1200" stroke="#24e5ff" stroke-width="1" opacity=".4"><animate attributeName="opacity" values=".15;.8;.15" dur="3s" repeatCount="indefinite"/></path>
</g>
</svg>